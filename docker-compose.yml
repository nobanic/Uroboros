# Legacy minimal development topology. The supported Uroboros 0.5 Windows and
# Linux launchers use clean/compose.yml; install.sh delegates to clean/start.sh.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uroboros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-uroboros}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uroboros} -d ${POSTGRES_DB:-uroboros}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Client-only Tor egress for bounded, grant-scoped GET/HEAD research. It has
  # no host port, relay, exit, hidden-service or ControlPort role. The default
  # build is pinned in tor-research/Dockerfile; deployments may replace it with
  # an audited immutable image through docker-compose.tor-research.yml.
  tor-research:
    platform: linux/amd64
    image: ${UROBOROS_TOR_IMAGE:-uroboros/tor-research:0.4.9.14}
    build:
      context: ./tor-research
      args:
        TOR_VERSION: ${UROBOROS_TOR_VERSION:-0.4.9.14-0+deb13u1}
    user: "debian-tor:debian-tor"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    expose: ["9050"]
    tmpfs:
      - /var/lib/tor:rw,noexec,nosuid,nodev,size=64m,mode=0700,uid=100,gid=101
      - /run/tor:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=100,gid=101
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    networks:
      tor-research-control:
        ipv4_address: 172.30.61.2
      tor-research-egress: {}
    restart: unless-stopped

  uroboros:
    image: nobanic/uroboros:${UROBOROS_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      tor-research:
        condition: service_healthy
    environment:
      UROBOROS_PG_DSN: postgres://${POSTGRES_USER:-uroboros}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-uroboros}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      UROBOROS_LLM_PROVIDER: ${UROBOROS_LLM_PROVIDER:-}
      UROBOROS_LLM_MODEL: ${UROBOROS_LLM_MODEL:-}
      UROBOROS_LLM_BASE_URL: ${UROBOROS_LLM_BASE_URL:-}
      UROBOROS_LLM_PROXY: ${UROBOROS_LLM_PROXY:-}
      UROBOROS_TOR_SOCKS_URL: socks5://tor-research:9050
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Bind the data directory (containing jwt.key, SQLite, etc.) to data/ in the project root,
      # for easy viewing/backup on the host, and so it survives container rebuilds.
      - ./data:/app/data
      # Mount the project root's skills into the container (overriding the image's built-in /app/skills);
      # changing a skill needs no image rebuild—the container reads this host copy.
      - ./skills:/app/skills
    networks:
      default: {}
      tor-research-control: {}
    restart: unless-stopped

volumes:
  pgdata:

networks:
  default: {}
  # Only the application and Tor SOCKS listener share this internal segment.
  tor-research-control:
    internal: true
    ipam:
      config:
        - subnet: 172.30.61.0/24
  # Dedicated Tor outbound segment; the application is not a member. Other app
  # egress (LLM, audited DDGS and target traffic) remains independently governed.
  tor-research-egress: {}
