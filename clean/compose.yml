name: uroboros

networks:
  dbnet:
    internal: true
    ipam:
      config:
        - subnet: 10.96.7.0/24
  egress:
    ipam:
      config:
        - subnet: 10.96.8.0/24
  tor-control:
    internal: true
    ipam:
      config:
        - subnet: 172.30.75.0/24
  tor-egress: {}

volumes:
  postgres_data:
  uroboros_data:
  uroboros_keystore:
  arsenal_jobs:
  api_lab_data:
  binary_cas:
  binary_app_socket:
  binary_worker_socket:

services:
  volume-init:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    network_mode: none
    command:
      - /bin/sh
      - -ec
      - |
        chown 65531:65531 /app-data /keystore /cas /app-socket
        chown 65531:65533 /worker-socket
        chmod 0700 /app-data /keystore /cas /app-socket
        chmod 2710 /worker-socket
    volumes:
      - uroboros_data:/app-data
      - uroboros_keystore:/keystore
      - binary_cas:/cas
      - binary_app_socket:/app-socket
      - binary_worker_socket:/worker-socket
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    restart: "no"

  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    networks: [dbnet]
    environment:
      POSTGRES_USER: uroboros
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generated by clean/start.ps1}
      POSTGRES_DB: uroboros
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U uroboros -d uroboros]
      interval: 5s
      timeout: 3s
      retries: 30
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  tor-research:
    platform: linux/amd64
    image: uroboros/tor-research:0.4.9.14
    build:
      context: ..
      dockerfile: tor-research/Dockerfile
      args:
        TOR_VERSION: 0.4.9.14-0+deb13u1
        TORRC_FILE: clean/torrc
    user: debian-tor:debian-tor
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    expose: ["9050"]
    tmpfs:
      - /var/lib/tor:rw,noexec,nosuid,nodev,size=64m,mode=0700,uid=100,gid=101
      - /run/tor:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=100,gid=101
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    networks:
      tor-control:
        ipv4_address: 172.30.75.2
      tor-egress: {}
    restart: unless-stopped

  binary-broker:
    platform: linux/amd64
    image: uroboros-b0/binary-broker@sha256:0fc4e1bfe1c398f2371aa7b0f18c8b6a2fdbf3e3544b6ea3c3576fc734f58173
    pull_policy: never
    depends_on:
      volume-init:
        condition: service_completed_successfully
    user: "65531:65531"
    group_add: ["65533"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    environment:
      UROBOROS_BINARY_BROKER_ROOT: /var/lib/uroboros-binary
      UROBOROS_BINARY_BROKER_SOCKET: /run/uroboros-app/broker.sock
      UROBOROS_BINARY_WORKER_SOCKET: /run/uroboros-worker/worker.sock
      UROBOROS_BINARY_WORKER_IMAGE_DIGEST: "sha256:142bdcf03aa22e6a27fead6dedf89391155a46210375f007871bd09726315514"
    volumes:
      - binary_cas:/var/lib/uroboros-binary
      - binary_app_socket:/run/uroboros-app
      - binary_worker_socket:/run/uroboros-worker
    restart: unless-stopped

  binary-worker:
    platform: linux/amd64
    image: uroboros-b0/binary-worker@sha256:142bdcf03aa22e6a27fead6dedf89391155a46210375f007871bd09726315514
    pull_policy: never
    depends_on:
      binary-broker:
        condition: service_started
    user: "65532:65533"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    environment:
      UROBOROS_BINARY_WORKER_SOCKET: /run/uroboros-worker/worker.sock
      UROBOROS_BINARY_WORKER_IDENTITY: "sha256:142bdcf03aa22e6a27fead6dedf89391155a46210375f007871bd09726315514"
    volumes:
      - binary_worker_socket:/run/uroboros-worker
    tmpfs:
      - /work:rw,noexec,nosuid,nodev,size=1g,mode=0700,uid=65532,gid=65532
    restart: always

  uroboros:
    image: uroboros/app:local
    build:
      context: ..
      dockerfile: Dockerfile
      target: source-app
      args:
        NEXT_PUBLIC_AUTH_DISABLED: "0"
        UROBOROS_VERSION: "0.5"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      tor-research:
        condition: service_healthy
      binary-broker:
        condition: service_started
    user: "65531:65531"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 1024
    mem_limit: 4g
    cpus: 3.0
    environment:
      HOME: /tmp/uroboros-home
      XDG_CONFIG_HOME: /tmp/uroboros-home/config
      UROBOROS_AUTH_DISABLED: "0"
      UROBOROS_PG_DSN: postgres://uroboros:${POSTGRES_PASSWORD}@postgres:5432/uroboros?sslmode=disable
      UROBOROS_TOR_SOCKS_URL: socks5://172.30.75.2:9050
      UROBOROS_ARSENAL_PROXY_LISTEN_HOST: 0.0.0.0
      UROBOROS_ARSENAL_PROXY_ADVERTISE_HOST: uroboros
      UROBOROS_BINARY_BROKER_SOCKET: /run/uroboros-app/broker.sock
      UROBOROS_BINARY_WORKER_IMAGE_DIGEST: "sha256:142bdcf03aa22e6a27fead6dedf89391155a46210375f007871bd09726315514"
    command: ["-addr", ":8787", "-proxy", ":8788", "-data", "/app/data"]
    ports:
      - 127.0.0.1:${UROBOROS_PORT:-8805}:8787
    expose: ["8788"]
    volumes:
      - uroboros_data:/app/data
      - uroboros_keystore:/app/keystore
      - binary_app_socket:/run/uroboros-app
    tmpfs:
      - /tmp:rw,nosuid,nodev,exec,size=1g,uid=65531,gid=65531,mode=0700
    networks: [dbnet, egress, tor-control]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8787/api/health]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  arsenal:
    image: uroboros/arsenal:local
    build:
      context: ../arsenal
      dockerfile: Dockerfile
      args:
        ARSENAL_SOURCE_REVISION: ${UROBOROS_SOURCE_REVISION:-local-clean-0.5}
    networks: [dbnet]
    environment:
      ARSENAL_TOKEN: ${ARSENAL_TOKEN:?generated by clean/start.ps1}
      ARSENAL_ALLOWLIST: ""
      ARSENAL_MAX_PARALLEL: "2"
      ARSENAL_JOB_DB: /var/lib/arsenal/jobs.sqlite3
      ARSENAL_NUCLEI_JOB_TIMEOUT: "3600"
      ARSENAL_SOURCE_REVISION: ${UROBOROS_SOURCE_REVISION:-local-clean-0.5}
      NUCLEI_TEMPLATE_DIR: /opt/nuclei-templates
    volumes:
      - arsenal_jobs:/var/lib/arsenal
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 4096
    restart: unless-stopped

  api-lab:
    image: uroboros/api-lab:local
    build:
      context: ..
      dockerfile: api_lab/Dockerfile
    networks: [dbnet]
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
      PYTHONDONTWRITEBYTECODE: "1"
      API_LAB_TOKEN: ${API_LAB_TOKEN:?generated by clean/start.ps1}
      API_LAB_IDENTITIES: /run/api-lab/identities.json
    volumes:
      - api_lab_data:/var/lib/api-lab
      - ./api-lab-identities.json:/run/api-lab/identities.json:ro
      - ..:/sources/uroboros:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped

  bootstrap:
    image: uroboros/app:local
    pull_policy: never
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      arsenal:
        condition: service_started
      api-lab:
        condition: service_started
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        /app/uroboros -addr 127.0.0.1:8787 -proxy '' -data /app/data &
        app_pid=$$!
        cleanup() {
          kill -TERM "$$app_pid" 2>/dev/null || true
          wait "$$app_pid" 2>/dev/null || true
        }
        trap cleanup EXIT INT TERM
        python /bootstrap/bootstrap.py
    user: "65531:65531"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: /tmp/uroboros-home
      XDG_CONFIG_HOME: /tmp/uroboros-home/config
      UROBOROS_AUTH_DISABLED: "1"
      UROBOROS_PG_DSN: postgres://uroboros:${POSTGRES_PASSWORD}@postgres:5432/uroboros?sslmode=disable
      UROBOROS_BASE: http://127.0.0.1:8787
      ARSENAL_MCP_URL: http://arsenal:8000/mcp
      API_LAB_MCP_URL: http://api-lab:8010/mcp
      ARSENAL_TOKEN: ${ARSENAL_TOKEN:?generated by clean/start.ps1}
      API_LAB_TOKEN: ${API_LAB_TOKEN:?generated by clean/start.ps1}
    volumes:
      - ./bootstrap.py:/bootstrap/bootstrap.py:ro
      - uroboros_data:/app/data
    networks: [dbnet]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,exec,size=1g,uid=65531,gid=65531,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 1024
    mem_limit: 4g
    cpus: 3.0
    restart: "no"
